name: Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege permissions
permissions:
  contents: read

jobs:
  # ── 1. Secret scanning (gitleaks) ───────────────────────────
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 2. Dependency audit (npm) ────────────────────────────────
  dependency-audit:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline
          else
            echo "No package.json found — skipping npm install"
          fi

      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No package.json found — skipping npm audit"
          fi

  # ── 3. Pattern check for likely API-key leaks ───────────────
  pattern-check:
    name: Pattern Check (API key patterns in tracked files)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for likely API key patterns
        run: |
          set +e
          FAIL=0

          # Patterns that strongly indicate a hardcoded key
          PATTERNS=(
            'AIza[0-9A-Za-z_-]{35}'
            'sk-[A-Za-z0-9]{32,}'
            'ghp_[A-Za-z0-9]{36}'
            'ghs_[A-Za-z0-9]{36}'
            'ghu_[A-Za-z0-9]{36}'
            'api_key\s*=\s*["\x27][A-Za-z0-9._-]{16,}'
            'apiKey\s*:\s*["\x27][A-Za-z0-9._-]{16,}'
            'Bearer\s+[A-Za-z0-9+/=._-]{32,}'
          )

          for pattern in "${PATTERNS[@]}"; do
            result=$(git grep -E --ignore-case "$pattern" -- \
              ':!.git' ':!.github/workflows' ':!node_modules' ':!*.lock' 2>/dev/null)
            if [ -n "$result" ]; then
              echo "::error::Possible API key pattern detected: $pattern"
              echo "$result"
              FAIL=1
            fi
          done

          # Fail if .env (not .env.example) is tracked
          if git ls-files | grep -qE '^\.env$'; then
            echo "::error::.env file is tracked in git — remove it immediately!"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then
            echo "::error::Security check failed. Review the patterns above."
            exit 1
          fi

          echo "✅ No high-confidence key patterns found."
